# S/MIME signing + encryption profile.
name = "email-protection"
default_days = 365

[basic_constraints]
ca = false

[key_usage]
critical = true
digital_signature = true
key_encipherment = true

[extended_key_usage]
email_protection = true

[subject_alt_name]
# SECURITY: a CSR-requested subjectAltName is the requester's claim, not a
# verified fact, so it is NOT certified by default. Either list the names
# here (`email = ["user@example"]`) or, after checking them, pass
# `ca sign-csr -copy-csr-san` for a single issuance.
from_csr = false

[subject_key_identifier]
include = true

[authority_key_identifier]
include = true
