name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

  no_std:
    name: no_std builds (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # thumbv7em-none-eabi is a 32-bit bare-metal target: it catches both
        # accidental `std` dependencies and 64-bit-only arithmetic (e.g.
        # `usize` shifts that overflow when `usize` is 32 bits wide).
        target: [x86_64-unknown-linux-gnu, thumbv7em-none-eabi]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build bare no_std (no default features)
        run: cargo build --target ${{ matrix.target }} --no-default-features

      - name: Build no_std with all module features
        run: cargo build --target ${{ matrix.target }} --no-default-features --features bignum,hash,cipher,kdf

      # `ec` must not require `alloc`: the fixed-curve primitives (P-256
      # ECDSA/ECDH, X25519, X448, Ed25519, Ed448) are usable on allocator-free
      # targets. Guards against a stray `alloc::` creeping back into an
      # ungated EC path — which fails here as E0433, since `extern crate alloc`
      # is itself feature-gated.
      - name: Build ec without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec

      # `rsa` declares no `alloc` dependency; keep that honest. Without alloc it
      # provides key generation, the raw primitives and primality testing (the
      # padded schemes live in the alloc-gated `emsa`/`pkcs1`/`pss` modules).
      - name: Build rsa without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features rsa

      # `lms` without alloc: single-tree LMS keygen/sign/verify (the secure-boot
      # shape). HSS is alloc-gated — its level vectors are runtime-sized.
      - name: Build lms without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features lms

      # `xmss` without alloc: verification (what a device running secure boot
      # does). Keygen/signing stay alloc-gated — the subtree cache is
      # runtime-sized and O(2^h).
      - name: Build xmss without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features xmss

      # ...and the alloc-gated half (boxed multi-curve, SM2, DER/PEM codecs)
      # must still build when `alloc` is present but `std` is not.
      - name: Build ec with alloc, no std
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec,alloc,der,kdf

      # `ec` + `der` without `x509`: regression guard for the SM2 SPKI codecs,
      # which must not reach into the `x509`-gated `oid` module.
      - name: Build ec + der without x509
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec,der,alloc

      # The sans-I/O TLS/DTLS engine must build without `std`: it takes entropy
      # as a caller-supplied `EntropySource` and never reaches for `OsRng`.
      # Run on the hosted target only (the alloc `Arc` it uses needs atomics).
      - name: Build no_std TLS/DTLS engine
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --target ${{ matrix.target }} --no-default-features --features tls,dtls,mldsa

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. Compiling on
      # the declared minimum guards against accidentally using a std/library or
      # language feature newer than 1.88 (behavior itself is covered by the
      # stable `test` jobs, so this is compile-only).
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --all-features --all-targets
        run: cargo check --all-features --all-targets

  c_abi:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build the C library (static + shared)
        run: |
          cargo rustc --lib --release --features ffi --crate-type staticlib
          cargo rustc --lib --release --features ffi --crate-type cdylib

      - name: Compile and run the C smoke tests
        run: |
          cc tests/ffi_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_smoke
          ./ffi_smoke
          cc tests/ffi_tls_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_tls_smoke
          ./ffi_tls_smoke
          cc tests/ffi_dtls_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_dtls_smoke
          ./ffi_dtls_smoke
          cc tests/ffi_quic_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_quic_smoke
          ./ffi_quic_smoke

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
