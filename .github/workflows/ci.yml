name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

  no_std:
    name: no_std builds (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # thumbv7em-none-eabi is a 32-bit bare-metal target: it catches both
        # accidental `std` dependencies and 64-bit-only arithmetic (e.g.
        # `usize` shifts that overflow when `usize` is 32 bits wide).
        target: [x86_64-unknown-linux-gnu, thumbv7em-none-eabi]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build bare no_std (no default features)
        run: cargo build --target ${{ matrix.target }} --no-default-features

      - name: Build no_std with all module features
        run: cargo build --target ${{ matrix.target }} --no-default-features --features bignum,hash,cipher,kdf

      # `ec` must not require `alloc`: the fixed-curve primitives (P-256
      # ECDSA/ECDH, X25519, X448, Ed25519, Ed448) are usable on allocator-free
      # targets. Guards against a stray `alloc::` creeping back into an
      # ungated EC path — which fails here as E0433, since `extern crate alloc`
      # is itself feature-gated.
      - name: Build ec without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec

      # `rsa` declares no `alloc` dependency; keep that honest. Without alloc it
      # provides key generation, the raw primitives and primality testing (the
      # padded schemes live in the alloc-gated `emsa`/`pkcs1`/`pss` modules).
      - name: Build rsa without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features rsa

      # `lms` without alloc: single-tree LMS keygen/sign/verify (the secure-boot
      # shape). HSS is alloc-gated — its level vectors are runtime-sized.
      - name: Build lms without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features lms

      # `xmss` without alloc: verification (what a device running secure boot
      # does). Keygen/signing stay alloc-gated — the subtree cache is
      # runtime-sized and O(2^h).
      - name: Build xmss without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features xmss

      # `mldsa` without alloc: every ML-DSA length is fixed by the parameter
      # set, so keygen, signing and verification are all allocator-free.
      - name: Build mldsa without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features mldsa

      # `slhdsa` without alloc: keygen, signing (into a caller buffer — these
      # signatures reach ~49 KiB) and verification.
      - name: Build slhdsa without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features slhdsa

      # `aez` without alloc: encrypt/decrypt into caller buffers.
      - name: Build aez without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features aez

      # ...and the alloc-gated half (boxed multi-curve, SM2, DER/PEM codecs)
      # must still build when `alloc` is present but `std` is not.
      - name: Build ec with alloc, no std
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec,alloc,der,kdf

      # `ec` + `der` without `x509`: regression guard for the SM2 SPKI codecs,
      # which must not reach into the `x509`-gated `oid` module.
      - name: Build ec + der without x509
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ec,der,alloc

      # The sans-I/O TLS/DTLS engine must build without `std`: it takes entropy
      # as a caller-supplied `EntropySource` and never reaches for `OsRng`.
      # Run on the hosted target only (the alloc `Arc` it uses needs atomics).
      - name: Build no_std TLS/DTLS engine
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --target ${{ matrix.target }} --no-default-features --features tls,dtls,mldsa

  cross_check:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Targets whose *only* coverage is a platform-specific `cfg` block that
        # no other job ever compiles. Clippy does not lint `#[cfg(target_*)]`
        # arms for other targets, so without this job those arms are never seen
        # by a compiler at all.
        #
        # * arm/thumbv7neon-unknown-linux-gnueabihf — the armv7 `getrandom(2)`
        #   raw-syscall arm in `src/rng/linux_getrandom.rs`. `linux-getrandom`
        #   is in the DEFAULT feature set, so a build failure here means an
        #   armv7 Linux consumer cannot build the crate at all (or turns the
        #   feature off and silently loses early-boot blocking). Both
        #   instruction sets are checked: the syscall number goes in `r7`,
        #   which LLVM reserves as the frame pointer in **Thumb** mode only, so
        #   the ARM-mode target alone would not catch a regression there.
        # * riscv64gc-unknown-linux-gnu — the riscv64 `ecall` arm.
        # * wasm32-unknown-unknown / wasm32-wasip1 — the two `OsRng` host
        #   entropy backends in `src/rng/wasm.rs`.
        include:
          - target: arm-unknown-linux-gnueabihf
            args: ""
          - target: thumbv7neon-unknown-linux-gnueabihf
            args: ""
          - target: riscv64gc-unknown-linux-gnu
            args: ""
          - target: wasm32-unknown-unknown
            args: ""
          - target: wasm32-wasip1
            args: "--features wasi-getrandom"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      # `cargo check` only — these targets need no native linker, and the point
      # is to compile the per-target `cfg` arms, not to run them.
      - name: cargo check (default features)
        run: cargo check --target ${{ matrix.target }} ${{ matrix.args }}

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. Compiling on
      # the declared minimum guards against accidentally using a std/library or
      # language feature newer than 1.89 (behavior itself is covered by the
      # stable `test` jobs, so this is compile-only).
      - name: Install Rust 1.89 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --all-features --all-targets
        run: cargo check --all-features --all-targets

  c_abi:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build the C library (static + shared)
        run: |
          cargo rustc --lib --release --features ffi --crate-type staticlib
          cargo rustc --lib --release --features ffi --crate-type cdylib

      - name: Compile and run the C smoke tests
        run: |
          cc tests/ffi_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_smoke
          ./ffi_smoke
          cc tests/ffi_tls_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_tls_smoke
          ./ffi_tls_smoke
          cc tests/ffi_dtls_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_dtls_smoke
          ./ffi_dtls_smoke
          cc tests/ffi_quic_smoke.c -I include target/release/libpurecrypto.a \
             -lpthread -ldl -lm -o ffi_quic_smoke
          ./ffi_quic_smoke

  avx512_sde:
    name: AVX-512 kernels under Intel SDE
    runs-on: ubuntu-latest
    # The AVX-512 kernels — SHA-256 `compress16`, Keccak-p x8, BLAKE3
    # `hash_chunks16`, the ChaCha20 16-block kernel and `transpose16_epi32` —
    # are each pinned by a differential test against the scalar reference, but
    # every one of those tests returns early when the CPU lacks the feature.
    # No GitHub-hosted runner has AVX-512, so on the `test` job above they all
    # pass vacuously: a green CI is not evidence those kernels are correct.
    #
    # Intel SDE emulates the ISA *and* CPUID, so `is_x86_feature_detected!`
    # reports AVX-512 and the differential tests actually run. Read the log:
    # this job is only meaningful if the RUNNING (not SKIPPED) lines appear.
    #
    # `continue-on-error` because SDE is fetched from a versioned Intel
    # download URL that moves when Intel publishes a new build; a dead link
    # must not gate merges. Treat a red X here as "look at the log", not
    # "ignore me".
    continue-on-error: true
    env:
      # Bump when Intel retires this build.
      SDE_URL: https://downloadmirror.intel.com/850782/sde-external-9.44.0-2024-08-22-lin.tar.xz
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: sde

      - name: Install Intel SDE
        run: |
          set -euxo pipefail
          curl -fsSL -o sde.tar.xz "$SDE_URL"
          mkdir -p "$HOME/sde"
          tar -xf sde.tar.xz -C "$HOME/sde" --strip-components=1
          echo "$HOME/sde" >> "$GITHUB_PATH"
          # SDE injects itself with ptrace; Yama blocks that by default.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      # Build natively — only the *execution* needs emulating, and compiling
      # rustc's output under SDE would take the better part of an hour.
      - name: Build the unit-test binary natively
        run: cargo test --all-features --lib --no-run

      - name: Run the hash and cipher tests on an emulated AVX-512 CPU
        run: |
          set -euo pipefail
          bin=$(cargo test --all-features --lib --no-run --message-format=json \
                | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable' \
                | grep -v null | head -n1)
          echo "test binary: $bin"
          # -spr = Sapphire Rapids: AVX-512F/BW/DQ/VL + VBMI/IFMA/VAES/GFNI.
          sde64 -spr -- "$bin" --nocapture hash::
          sde64 -spr -- "$bin" --nocapture cipher::

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
