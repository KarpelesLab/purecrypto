name: Interop

# TLS 1.3 interop matrix: the purecrypto CLI against other TLS stacks, in
# BOTH roles, over real loopback TCP sockets — certificate kinds × key
# exchange groups × cipher suites for plain handshakes, then resumption,
# 0-RTT (accepted, and rejected across a HelloRetryRequest), HRR per group,
# mTLS per certificate kind, KeyUpdate from either side, RFC 8879
# certificate compression, RFC 7250 raw public keys in either direction,
# OCSP stapling, ALPN, record_size_limit, a > 16 KiB chain and the TLS 1.2
# fallback. Both sides' logs are checked for the negotiated parameters.
# A peer that speaks DTLS (wolfSSL) also gets the DTLS 1.2 and DTLS 1.3
# matrix over loopback UDP: HelloRetryRequest per group, KeyUpdate with
# its epoch change, fragmentation of a > 16 KiB chain at two MTUs, and a
# handshake through a relay that drops 20% of the datagrams.
#
# Loopback (purecrypto<->purecrypto) cannot catch a symmetric bug or a
# missing advertisement: the client only sent `psk_key_exchange_modes` when
# it already held a session, so a BoringSSL server never issued it a ticket
# and nothing could ever be resumed against one — loopback resumed happily.
# This matrix does not.
#
# One job per peer (`matrix.include`); add a peer by appending an entry and,
# if it needs building, a conditional build step. The matrix itself lives in
# tools/interop/run.sh (see tools/interop/README.md for the adapter
# contract); every process runs under `timeout` so a hang fails its case in
# seconds.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) supersedes this run: cancel the
# older one instead of queueing every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # OpenSSL built from source for the `openssl-src` peer: X25519MLKEM768,
  # ML-DSA certificates, raw public keys and certificate compression with
  # zlib, brotli and zstd, none of which the runner's OpenSSL 3.0 has. Bump
  # deliberately: the cache key follows it.
  OPENSSL_SRC_TAG: openssl-3.6.4
  # google/boringssl master of 2026-09-27 (the same pin as
  # interop-boringssl.yml). Bump deliberately: the cache key follows it.
  BORINGSSL_COMMIT: 5112448a24999caecfb6f04281379016ac79dc9a
  # Mbed TLS release tag for the `mbedtls` peer (built from source with
  # early data and record_size_limit enabled; 4.x carries the TF-PSA-Crypto
  # and framework submodules). Bump deliberately: the cache key follows it.
  MBEDTLS_TAG: mbedtls-4.2.0
  # LibreSSL portable, the newest 4.x release tarball, built here and
  # cached. Bump both together: the cache key follows the version.
  LIBRESSL_VERSION: 4.3.2
  LIBRESSL_SHA256: edf01aee24c65d69e6a9efcb9d44bcda682ff9d4f3bbbd95e794e1dfa90847b5
  # GnuTLS built from the release tarball for the `gnutls-src` peer, with
  # leancrypto for X25519MLKEM768 and ML-DSA (3.8.10+; no distribution
  # package ships them) and a nettle 3.10 (3.8.11+ needs it; ubuntu-24.04
  # has 3.9). Bump deliberately: the cache key follows them.
  GNUTLS_SRC_VERSION: 3.8.13
  LEANCRYPTO_TAG: v1.9.1
  NETTLE_SRC_VERSION: 3.10.2
  # wolfSSL's example client / server, built from this release tag with
  # DTLS 1.3 and everything else the matrix touches. Bump deliberately:
  # the cache key follows it.
  WOLFSSL_TAG: v5.9.4-stable

jobs:
  interop:
    name: TLS 1.3 vs ${{ matrix.label || matrix.peer }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        # Git Bash on the Windows runner too (run.sh is bash).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's OpenSSL 3.0.x: classical TLS 1.3 only.
          - peer: openssl-system
            runs-on: ubuntu-latest
          # OpenSSL at $OPENSSL_SRC_TAG, built here and cached.
          - peer: openssl-src
            runs-on: ubuntu-latest
          # BoringSSL's bssl tool at $BORINGSSL_COMMIT, built here and cached.
          - peer: boringssl
            runs-on: ubuntu-latest
          # Mbed TLS ssl_client2 / ssl_server2 at $MBEDTLS_TAG, built here
          # and cached.
          - peer: mbedtls
            runs-on: ubuntu-latest
          # Windows SChannel through .NET's SslStream: the C# peer in
          # peers/schannel/, built on the runner with its dotnet SDK.
          - peer: schannel
            runs-on: windows-latest
          # Apple's TLS stack (Network.framework) of the macOS runner, through
          # the Swift tool in tools/interop/peers/apple (built by the adapter).
          - peer: apple
            runs-on: macos-latest
          # LibreSSL $LIBRESSL_VERSION, built from the release tarball and
          # cached (X25519MLKEM768; no resumption, no EMS).
          - peer: libressl
            label: libressl (source)
            runs-on: ubuntu-latest
          # The LibreSSL every Mac ships as /usr/bin/openssl (3.3.x): an
          # older, widely deployed build. Its `ocsp` responder signs with
          # SHA-1, so the OCSP responses come from Homebrew's OpenSSL 3.
          - peer: libressl
            label: libressl (macOS system)
            libressl: system
            runs-on: macos-latest
          # The runner's gnutls-bin (GnuTLS 3.8.x from apt: classical TLS
          # 1.3, raw public keys, zlib compression, record_size_limit).
          - peer: gnutls
            runs-on: ubuntu-latest
          # GnuTLS $GNUTLS_SRC_VERSION with leancrypto (X25519MLKEM768,
          # ML-DSA), built here and cached.
          - peer: gnutls-src
            runs-on: ubuntu-latest
          # wolfSSL's example tools at $WOLFSSL_TAG, built here and cached:
          # TLS 1.3 plus the DTLS 1.2 / 1.3 matrix.
          - peer: wolfssl
            runs-on: ubuntu-latest
          # A small DTLS driver on the same libwolfssl
          # (tools/interop/peers/wolfssl-driver/): the DTLS resumption and
          # 0-RTT cases the example tools cannot express (0-RTT towards a
          # wolfSSL server needs wolfSSL_dtls13_no_hrr_on_resume()).
          - peer: wolfssl-driver
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: System OpenSSL version
        run: openssl version -a

      # ---- apple -------------------------------------------------------
      # Homebrew's openssl@3 generates the OCSP response (the image's own
      # `openssl` may be LibreSSL), coreutils provides `timeout`.
      - name: macOS tooling
        if: matrix.peer == 'apple'
        run: |
          set -euxo pipefail
          sw_vers
          swift --version
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          "$(brew --prefix openssl@3)/bin/openssl" version
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >>"$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >>"$GITHUB_PATH"
          tools/interop/peers/apple/build.sh

      # ---- openssl-src -------------------------------------------------
      - name: Cache OpenSSL (source build)
        if: matrix.peer == 'openssl-src'
        id: cache-openssl-src
        uses: actions/cache@v5
        with:
          path: ~/openssl-src
          key: openssl-src-${{ env.OPENSSL_SRC_TAG }}-${{ runner.os }}-v2

      - name: Build OpenSSL from source
        if: matrix.peer == 'openssl-src' && steps.cache-openssl-src.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev libbrotli-dev libzstd-dev
          git clone --depth 1 --branch "$OPENSSL_SRC_TAG" https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          # zlib, brotli and zstd for RFC 8879 certificate compression (one
          # interop case pins each). OpenSSL itself is static, so the cached
          # binary needs no library path; brotli and zstd are the runner
          # image's shared libraries (libbrotli1, libzstd1 — present on
          # every ubuntu image: curl and dpkg depend on them).
          ./Configure --prefix="$HOME/openssl-src" --openssldir="$HOME/openssl-src/ssl" \
            --libdir=lib no-shared no-tests enable-zlib enable-brotli enable-zstd
          make -j"$(nproc)" build_sw
          make install_sw
          "$HOME/openssl-src/bin/openssl" version -a
          "$HOME/openssl-src/bin/openssl" list -disabled

      # ---- boringssl ---------------------------------------------------
      - name: Cache bssl
        if: matrix.peer == 'boringssl'
        id: cache-bssl
        uses: actions/cache@v5
        with:
          path: ~/bssl
          key: bssl-${{ env.BORINGSSL_COMMIT }}-${{ runner.os }}-v1

      - name: Build bssl
        if: matrix.peer == 'boringssl' && steps.cache-bssl.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          git init boringssl
          cd boringssl
          git fetch --depth 1 https://github.com/google/boringssl.git "$BORINGSSL_COMMIT"
          git checkout --detach FETCH_HEAD
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release
          ninja -C build bssl
          mkdir -p ~/bssl
          cp build/bssl ~/bssl/bssl

      # ---- mbedtls -----------------------------------------------------
      - name: Cache Mbed TLS
        if: matrix.peer == 'mbedtls'
        id: cache-mbedtls
        uses: actions/cache@v5
        with:
          path: ~/mbedtls
          key: mbedtls-${{ env.MBEDTLS_TAG }}-${{ runner.os }}-v1

      - name: Build Mbed TLS ssl_client2 / ssl_server2
        if: matrix.peer == 'mbedtls' && steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-jinja2 python3-jsonschema
          git clone --depth 1 --branch "$MBEDTLS_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          # Off by default: 0-RTT and RFC 8449. Everything else the matrix
          # needs (TLS 1.3, compatibility mode, tickets, ALPN, the NIST
          # curves and X25519) is on in the default configuration.
          python3 scripts/config.py set MBEDTLS_SSL_EARLY_DATA
          python3 scripts/config.py set MBEDTLS_SSL_RECORD_SIZE_LIMIT
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=Off -DENABLE_PROGRAMS=On
          ninja -C build ssl_client2 ssl_server2
          mkdir -p ~/mbedtls/bin
          cp build/programs/ssl/ssl_client2 build/programs/ssl/ssl_server2 ~/mbedtls/bin/
          ~/mbedtls/bin/ssl_client2 build_version=1

      # ---- schannel ----------------------------------------------------
      - name: Set up .NET
        if: matrix.peer == 'schannel'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Windows and .NET versions
        if: matrix.peer == 'schannel'
        run: |
          cmd //c ver
          dotnet --info | head -20

      # The GitHub Windows Server image pins SChannel's TLS policy (the
      # group-policy cipher-suite and ECC-curve lists under
      # HKLM\SOFTWARE\Policies\...\SSL\00010002) to a short list without
      # curve25519 or ChaCha20, both of which the OS supports and has in
      # its local defaults. Append them to the policy lists, the way an
      # administrator would; SChannel picks the change up at once.
      - name: SChannel TLS policy
        if: matrix.peer == 'schannel'
        shell: pwsh
        run: |
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'
          if (Test-Path $pol) {
            $p = Get-ItemProperty $pol
            if ($p.PSObject.Properties.Name -contains 'EccCurves') {
              $curves = @($p.EccCurves)
              if ($curves -notcontains 'curve25519') { $curves += 'curve25519' }
              if ($curves -notcontains 'NistP521') { $curves += 'NistP521' }
              Set-ItemProperty $pol -Name EccCurves -Value ([string[]]$curves) -Type MultiString
            }
            if ($p.PSObject.Properties.Name -contains 'Functions') {
              $f = $p.Functions
              if ($f -notmatch 'TLS_CHACHA20_POLY1305_SHA256') { $f = "$f,TLS_CHACHA20_POLY1305_SHA256" }
              Set-ItemProperty $pol -Name Functions -Value $f -Type String
            }
          }
          Write-Host "--- ECC curves"
          Get-TlsEccCurve
          Write-Host "--- cipher suites"
          (Get-TlsCipherSuite).Name
      # ---- wolfssl -----------------------------------------------------
      - name: Cache wolfSSL
        if: matrix.peer == 'wolfssl' || matrix.peer == 'wolfssl-driver'
        id: cache-wolfssl
        uses: actions/cache@v5
        with:
          path: ~/wolfssl
          key: wolfssl-${{ env.WOLFSSL_TAG }}-${{ runner.os }}-v2

      - name: Build wolfSSL
        if: (matrix.peer == 'wolfssl' || matrix.peer == 'wolfssl-driver') && steps.cache-wolfssl.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool
          git clone --depth 1 --branch "$WOLFSSL_TAG" https://github.com/wolfSSL/wolfssl.git wolfssl-src
          cd wolfssl-src
          ./autogen.sh
          # Static, so the cached examples need no library path. The
          # features: TLS 1.3, DTLS 1.2/1.3 with connection IDs and a
          # settable MTU, session tickets + 0-RTT, ALPN, SNI, OCSP
          # stapling, X25519/Ed25519/X448/Ed448, ML-KEM and ML-DSA, raw
          # public keys, RSA-PSS (TLS 1.3 needs it), the HRR cookie, and
          # the OpenSSL-compat layer the examples' summaries use.
          # WOLFSSL_DTLS13_NO_HRR_ON_RESUME only makes
          # wolfSSL_dtls13_no_hrr_on_resume() available (a runtime opt-in
          # the examples never call, so their cases are unchanged); the
          # wolfssl-driver peer uses it for DTLS 1.3 0-RTT. The library and
          # headers are installed into ~/wolfssl for that driver.
          ./configure --prefix="$HOME/wolfssl" --enable-static --disable-shared \
            --enable-tls13 --enable-dtls --enable-dtls13 --enable-dtlscid \
            --enable-dtls-mtu --enable-dtls-frag-ch --enable-hrrcookie \
            --enable-session-ticket --enable-earlydata --enable-alpn \
            --enable-sni --enable-ocspstapling --enable-ocsp \
            --enable-curve25519 --enable-ed25519 --enable-curve448 \
            --enable-ed448 --enable-mlkem --enable-mldsa --enable-rpk \
            --enable-secure-renegotiation --enable-opensslextra \
            --enable-rsapss --enable-maxfragment --enable-psk \
            --enable-postauth --enable-sp-math-all \
            CPPFLAGS="-DWOLFSSL_DTLS13_NO_HRR_ON_RESUME"
          make -j"$(nproc)"
          make install
          # The examples chdir to the nearest ancestor holding certs/; the
          # adapter runs them from ~/wolfssl.
          mkdir -p ~/wolfssl/examples/client ~/wolfssl/examples/server
          cp examples/client/client ~/wolfssl/examples/client/
          cp examples/server/server ~/wolfssl/examples/server/
          cp -R certs ~/wolfssl/
          ~/wolfssl/examples/client/client -? | head -1

      # ---- libressl ----------------------------------------------------
      - name: Cache LibreSSL
        if: matrix.peer == 'libressl' && matrix.libressl != 'system'
        id: cache-libressl
        uses: actions/cache@v5
        with:
          path: ~/libressl
          key: libressl-${{ env.LIBRESSL_VERSION }}-${{ runner.os }}-v1

      - name: Build LibreSSL from the release tarball
        if: matrix.peer == 'libressl' && matrix.libressl != 'system' && steps.cache-libressl.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -sSfO "https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-$LIBRESSL_VERSION.tar.gz"
          echo "$LIBRESSL_SHA256  libressl-$LIBRESSL_VERSION.tar.gz" | sha256sum -c -
          tar xzf "libressl-$LIBRESSL_VERSION.tar.gz"
          cd "libressl-$LIBRESSL_VERSION"
          # Static, so the cached binary needs no library path.
          ./configure --prefix="$HOME/libressl" --disable-shared
          make -j"$(nproc)"
          make install
          "$HOME/libressl/bin/openssl" version

      # The macOS system LibreSSL: the adapter reads LIBRESSL; the OCSP
      # responses (the runner's, and the responder the adapter stands up
      # for `s_server -status_url`) need an OpenSSL 3 `ocsp`. GNU timeout
      # comes from coreutils.
      - name: Use the macOS system LibreSSL
        if: matrix.libressl == 'system'
        run: |
          set -euxo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install coreutils openssl@3
          /usr/bin/openssl version
          echo "LIBRESSL=/usr/bin/openssl" >>"$GITHUB_ENV"
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >>"$GITHUB_ENV"
      # ---- gnutls ------------------------------------------------------
      - name: Install GnuTLS
        if: matrix.peer == 'gnutls'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnutls-bin
          gnutls-cli --version | head -1
          gnutls-cli --list-config

      # ---- gnutls-src --------------------------------------------------
      - name: Cache GnuTLS (source build)
        if: matrix.peer == 'gnutls-src'
        id: cache-gnutls-src
        uses: actions/cache@v5
        with:
          path: ~/gnutls-src
          key: gnutls-src-${{ env.GNUTLS_SRC_VERSION }}-${{ env.LEANCRYPTO_TAG }}-nettle${{ env.NETTLE_SRC_VERSION }}-${{ runner.os }}-v2

      - name: Build GnuTLS from source
        if: matrix.peer == 'gnutls-src' && steps.cache-gnutls-src.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build libgmp-dev libunistring-dev libidn2-dev zlib1g-dev libbrotli-dev libzstd-dev
          PREFIX=$HOME/gnutls-src
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          # Everything links into the prefix by rpath, so the cached tree
          # needs no library path at run time.
          export LDFLAGS="-Wl,-rpath,$PREFIX/lib"
          curl -sSL "https://ftp.gnu.org/gnu/nettle/nettle-$NETTLE_SRC_VERSION.tar.gz" | tar xz
          (cd "nettle-$NETTLE_SRC_VERSION" &&
            ./configure --prefix="$PREFIX" --libdir="$PREFIX/lib" --disable-documentation &&
            make -j"$(nproc)" && make install)
          curl -sSL "https://github.com/smuellerDD/leancrypto/archive/refs/tags/$LEANCRYPTO_TAG.tar.gz" | tar xz
          # Only ML-KEM and ML-DSA are needed; the other PQC families are
          # left out of the build for time (disabling SLH-DSA breaks the
          # ASN.1 module, so it stays).
          (cd leancrypto-*/ &&
            meson setup build --prefix="$PREFIX" --libdir=lib -Dbuildtype=release \
              -Dtests=disabled -Dapps=disabled \
              -Dbike_1=disabled -Dbike_3=disabled -Dbike_5=disabled \
              -Dhqc_128=disabled -Dhqc_192=disabled -Dhqc_256=disabled \
              -Dsntrup_761=disabled -Dsntrup_857=disabled -Dsntrup_953=disabled \
              -Dsntrup_1013=disabled -Dsntrup_1277=disabled &&
            meson compile -C build && meson install -C build)
          curl -sSL "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-$GNUTLS_SRC_VERSION.tar.xz" | tar xJ
          (cd "gnutls-$GNUTLS_SRC_VERSION" &&
            ./configure --prefix="$PREFIX" --libdir="$PREFIX/lib" --with-leancrypto \
              --with-zlib --with-brotli --with-zstd \
              --disable-doc --disable-tests --disable-full-test-suite --disable-guile \
              --disable-cxx --disable-libdane --without-p11-kit --without-tpm --without-tpm2 \
              --with-included-libtasn1 --with-included-unistring &&
            make -j"$(nproc)" && make install)
          "$PREFIX/bin/gnutls-cli" --version | head -1
          "$PREFIX/bin/gnutls-cli" -l | grep -E '^(Groups|Public Key Systems|Compression)'

      # ---- purecrypto --------------------------------------------------
      - name: Build the purecrypto CLI
        run: cargo build --release --features ech --bin purecrypto

      - name: Interop matrix (both roles)
        timeout-minutes: 30
        run: |
          PC=$GITHUB_WORKSPACE/target/release/purecrypto
          [ "$RUNNER_OS" != Windows ] || PC=$PC.exe
          PURECRYPTO="$PC" \
          BSSL="$HOME/bssl/bssl" \
          MBEDTLS_BIN="$HOME/mbedtls/bin" \
          WOLFSSL_HOME="$HOME/wolfssl" \
          tools/interop/run.sh --peer "${{ matrix.peer }}"
